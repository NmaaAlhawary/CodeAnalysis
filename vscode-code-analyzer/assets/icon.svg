<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Magnifying glass lens -->
  <circle cx="6.2" cy="6.2" r="4.4" stroke="currentColor" stroke-width="1.4" fill="none"/>
  <!-- Handle -->
  <line x1="9.6" y1="9.6" x2="14.2" y2="14.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- < bracket inside lens -->
  <path d="M5.2 4.8 L3.6 6.2 L5.2 7.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- > bracket inside lens -->
  <path d="M7.2 4.8 L8.8 6.2 L7.2 7.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- spark dot (AI sparkle) at top-right of lens -->
  <circle cx="9.8" cy="2.8" r="1.1" fill="currentColor" opacity="0.85"/>
</svg>
